<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finanzübersicht</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand__mark">§</span>
        <span class="brand__name">Hauptbuch</span>
      </div>

      <nav class="nav" aria-label="Hauptnavigation">
        <a class="nav__item nav__item--active" href="#">
          <span class="nav__label">Übersicht</span>
        </a>
        <a class="nav__item" href="sidebar/bank_accounts.html">
          <span class="nav__label">Konten</span>
        </a>
        <a class="nav__item" href="sidebar/budgets.html">
          <span class="nav__label">Budgets</span>
        </a>
        <a class="nav__item" href="sidebar/transactions.html">
          <span class="nav__label">Transaktionen</span>
        </a>
      </nav>

      <div class="sidebar__footer">
        <span class="sidebar__period">Berichtszeitraum</span>
        <span class="sidebar__month">Placeholder 2026</span>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">

      <header class="topbar">
        <div class="topbar__month">
          <button class="month-nav" aria-label="Vorheriger Monat">‹</button>
          <span>August 2026</span>
          <button class="month-nav" aria-label="Nächster Monat">›</button>
        </div>
        <button class="btn btn--primary">+ Neue Transaktion</button>
      </header>

      <main class="content">

        <!-- Hero balance -->
        <section class="hero" aria-labelledby="hero-heading">
          <p class="eyebrow">Gesamtsaldo</p>
          <h1 id="hero-heading" class="hero__amount">
            <span class="hero__currency">€</span><span id="overview-total-balance">0,00</span>
          </h1>
          <p id="overview-difference" class="hero__delta hero__delta--positive">0,00 € gegenüber dem Vormonat</p>
        </section>

        <!-- Budget cards -->
        <section aria-labelledby="budgets-heading" class="section">
          <div class="section__head">
            <h2 id="budgets-heading">Favorisierte Budgets</h2>
            <a class="section__link" href="sidebar/budgets.html">Alle anzeigen</a>
          </div>

          <div id="favorite-budgets-grid" class="budget-grid"></div>
        </section>

        <!-- Ledger table -->
        <section aria-labelledby="ledger-heading" class="section">
          <div class="section__head">
            <h2 id="ledger-heading">Letzte Transaktionen</h2>
            <a class="btn btn--secondary section__link" href="sidebar/transactions.html">Weitere Transaktionen</a>
          </div>

          <div class="ledger">
            <table>
              <thead>
                <tr>
                  <th scope="col">Datum</th>
                  <th scope="col">Beschreibung</th>
                  <th scope="col">Kategorie</th>
                  <th scope="col" class="align-right">Betrag</th>
                </tr>
              </thead>
              <tbody id="recent-transactions-body"></tbody>
            </table>
          </div>
        </section>

      </main>
    </div>
  </div>

  <script>
    const BANK_ACCOUNTS_STORAGE_KEY = 'personal_finance_bank_accounts';
    const TRANSACTIONS_STORAGE_KEY = 'personal_finance_transactions';
    const BUDGETS_STORAGE_KEY = 'personal_finance_budgets';
    const overview_total_balance = document.getElementById('overview-total-balance');
    const overview_difference = document.getElementById('overview-difference');
    const recent_transactions_body = document.getElementById('recent-transactions-body');
    const favorite_budgets_grid = document.getElementById('favorite-budgets-grid');

    function getSavedBankAccounts() {
      try {
        const raw = localStorage.getItem(BANK_ACCOUNTS_STORAGE_KEY);
        if (!raw) return [];

        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];

        return parsed.map((account) => ({
          balance: Number.parseFloat(account.balance) || 0,
        }));
      } catch (error) {
        console.warn('Fehler beim Laden der Konten für die Übersicht:', error);
        return [];
      }
    }

    function getSavedTransactions() {
      try {
        const raw = localStorage.getItem(TRANSACTIONS_STORAGE_KEY);
        if (!raw) return [];

        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];

        return parsed.map((transaction) => ({
          id: String(transaction.id || `${Date.now()}-${Math.random()}`),
          description: String(transaction.description || 'Transaktion'),
          budget: String(transaction.budget || 'Allgemein'),
          amount: Number.parseFloat(transaction.amount) || 0,
          type: String(transaction.type || 'expense'),
          createdAt: String(transaction.createdAt || new Date().toISOString()),
        }));
      } catch (error) {
        console.warn('Fehler beim Laden der Transaktionen für die Übersicht:', error);
        return [];
      }
    }

    function getSavedBudgets() {
      try {
        const raw = localStorage.getItem(BUDGETS_STORAGE_KEY);
        if (!raw) return [];

        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];

        return parsed.map((budget) => ({
          id: String(budget.id || `${Date.now()}-${Math.random()}`),
          name: String(budget.name || 'Budget'),
          account: String(budget.account || budget.accountKey || 'Unbekannt'),
          accountKey: String(budget.accountKey || budget.account || 'Unbekannt'),
          type: budget.type === 'incremental' ? 'incremental' : 'fixed',
          targetAmount: Number.parseFloat(budget.targetAmount) || Number.parseFloat(budget.amount) || 0,
          amount: Number.parseFloat(budget.amount) || Number.parseFloat(budget.targetAmount) || 0,
          used: Number.parseFloat(budget.used) || Number.parseFloat(budget.currentAmount) || 0,
          favorite: Boolean(budget.favorite),
        }));
      } catch (error) {
        console.warn('Fehler beim Laden der Budgets für die Übersicht:', error);
        return [];
      }
    }

    function formatCurrency(value) {
      return new Intl.NumberFormat('de-DE', {
        style: 'currency',
        currency: 'EUR',
      }).format(value);
    }

    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return '—';
      }

      return new Intl.DateTimeFormat('de-DE', {
        day: '2-digit',
        month: '2-digit',
      }).format(date);
    }

    function renderRecentTransactions() {
      if (!recent_transactions_body) {
        return;
      }

      const transactions = [...getSavedTransactions()]
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
        .slice(0, 5);

      recent_transactions_body.innerHTML = '';

      if (!transactions.length) {
        const row = document.createElement('tr');
        row.innerHTML = '<td colspan="4">Keine Transaktionen vorhanden.</td>';
        recent_transactions_body.appendChild(row);
        return;
      }

      transactions.forEach((transaction) => {
        const row = document.createElement('tr');
        const amount_class = transaction.type === 'income' ? 'amount amount--positive' : 'amount amount--negative';
        const sign = transaction.type === 'income' ? '+' : '−';

        row.innerHTML = `
          <td>${formatDate(transaction.createdAt)}</td>
          <td>${transaction.description}</td>
          <td><span class="tag">${transaction.budget}</span></td>
          <td class="align-right ${amount_class}">${sign}${formatCurrency(Math.abs(transaction.amount))}</td>
        `;

        recent_transactions_body.appendChild(row);
      });
    }

    function renderFavoriteBudgets() {
      if (!favorite_budgets_grid) {
        return;
      }

      const budgets = getSavedBudgets().filter((budget) => budget.favorite);
      favorite_budgets_grid.innerHTML = '';

      if (!budgets.length) {
        const empty_state = document.createElement('div');
        empty_state.className = 'empty-state';
        empty_state.innerHTML = '<p>Keine favorisierten Budgets ausgewählt.</p>';
        favorite_budgets_grid.appendChild(empty_state);
        return;
      }

      budgets.forEach((budget) => {
        const card = document.createElement('article');
        card.className = 'budget-card';

        const used = Number.isFinite(budget.used) ? budget.used : 0;
        const target = Number.isFinite(budget.targetAmount) && budget.targetAmount > 0 ? budget.targetAmount : Math.max(budget.amount, 0);
        const percentage = target > 0 ? Math.min((used / Math.max(target, 1)) * 100, 100) : 0;
        const remaining = target - used;
        const isIncremental = budget.type === 'incremental';
        const amountDescription = isIncremental
          ? (budget.targetAmount > 0 ? `${formatCurrency(used)} / ${formatCurrency(target)}` : `${formatCurrency(used)} gespart`)
          : `${formatCurrency(used)} / ${formatCurrency(target)}`;

        const noteText = isIncremental
          ? (budget.targetAmount > 0
            ? (remaining >= 0 ? `${formatCurrency(remaining)} bis Ziel` : `${formatCurrency(Math.abs(remaining))} über Ziel`)
            : 'Ziel offen')
          : (remaining >= 0 ? `${formatCurrency(remaining)} übrig` : `${formatCurrency(Math.abs(remaining))} über Budget`);

        card.innerHTML = `
          <div class="budget-card__head">
            <span class="budget-card__label">${budget.name}</span>
            <span class="budget-card__figures">${amountDescription}</span>
          </div>
          <div class="budget-card__track">
            <div class="budget-card__fill ${remaining < 0 ? 'budget-card__fill--over' : ''}" style="width: ${percentage}%"></div>
          </div>
          <p class="budget-card__note ${remaining < 0 ? 'budget-card__note--over' : ''}">${budget.account} · ${noteText}</p>
        `;

        favorite_budgets_grid.appendChild(card);
      });
    }

    function updateOverviewSummary() {
      const accounts = getSavedBankAccounts();
      const total = accounts.reduce((sum, account) => sum + account.balance, 0);
      const previous_month_total = 0;
      const difference = total - previous_month_total;

      if (overview_total_balance) {
        overview_total_balance.textContent = new Intl.NumberFormat('de-DE', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(total);
      }

      if (overview_difference) {
        const formatted_difference = new Intl.NumberFormat('de-DE', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(Math.abs(difference));

        const sign = difference >= 0 ? '+' : '−';
        overview_difference.textContent = `${sign}${formatted_difference} € gegenüber dem Vormonat`;
        overview_difference.classList.toggle('hero__delta--negative', difference < 0);
        overview_difference.classList.toggle('hero__delta--positive', difference >= 0);
      }
    }

    updateOverviewSummary();
    renderRecentTransactions();
    renderFavoriteBudgets();
  </script>

</body>

</html>
